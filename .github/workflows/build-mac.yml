name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas
          pip install torch==2.3.0
          pip install dgl -f https://data.dgl.ai/wheels/repo.html
          python -c "import dgl; print('dgl import OK:', dgl.__version__)"
          pip install deepchem rdkit pyinstaller

      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --clean --distpath RT_Predictor_mac --workpath build_rt_mac RT_Predictor_mac.spec

      - name: Package zip
        run: |
          cd RT_Predictor_mac
          zip -qry RT_Predictor_v3_fix_${{ matrix.arch }}.zip RT_Predictor_v3.app

      - uses: actions/upload-artifact@v4
        with:
          name: RT_Predictor-v3-fix-${{ matrix.arch }}
          path: RT_Predictor_mac/RT_Predictor_v3_fix_*.zip
